[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vku-aiot-ml"
version = "1.0.0"
description = "Pipeline huấn luyện & suy luận cho trạm AIoT VKU (scikit-learn, LightGBM, statsmodels, PyTorch)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn==1.9.1", "lightgbm==4.7.0", "joblib>=1.3"]

[tool.setuptools]
packages = ["aiot_ml"]

[tool.setuptools.package-dir]
aiot_ml = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
