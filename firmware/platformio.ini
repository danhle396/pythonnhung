; Trạm AIoT VKU — firmware ESP32 (Arduino framework)
;   pio run -e esp32dev              # build
;   pio run -e esp32dev -t upload    # nạp
;   pio device monitor               # xem log 115200
;   pio test -e native               # unit test logic (filter, rule engine, model C) trên PC

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=1024
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BMP280 Library@^2.6.8
    claws/BH1750@^1.3.0
    adafruit/Adafruit SSD1306@^2.5.12
    adafruit/Adafruit GFX Library@^1.11.11
test_filter = test_gas_model

[env:native]
platform = native
build_flags = -std=gnu++17 -DNATIVE_TEST
build_src_filter = -<*> +<filters.cpp> +<edge_ai.cpp> +<alert.cpp> +<nowcast.cpp>
test_build_src = yes
