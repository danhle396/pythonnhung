# Mosquitto 2.x — trạm AIoT VKU
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Cổng MQTT thường (mạng LAN / Docker)
listener 1883
allow_anonymous false
# Trong Docker, passwd và acl được sinh/chép vào /mosquitto/auth (quyền root 0700) khi khởi động container.
# Chạy ngoài Docker: sửa 2 đường dẫn dưới thành vị trí file passwd (make_passwd.sh) và acl của bạn.
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# WebSocket (tuỳ chọn, cho dashboard web/MQTT.js)
listener 9001
protocol websockets

# (Nâng cao) TLS cổng 8883 — tạo CA tự ký bằng broker/mosquitto/gen_certs.sh rồi bỏ comment:
# listener 8883
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# require_certificate false

max_queued_messages 5000
max_packet_size 65536
