persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

listener 9001
protocol websockets


max_queued_messages 5000
max_packet_size 65536
