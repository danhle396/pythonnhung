apiVersion: 1
datasources:
  - name: TimescaleDB
    uid: timescale
    type: grafana-postgresql-datasource
    url: db:5432
    user: aiot
    jsonData:
      database: aiot
      sslmode: disable
      timescaledb: true
      postgresVersion: 1600
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    isDefault: true
